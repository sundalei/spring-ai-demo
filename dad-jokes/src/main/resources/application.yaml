spring:
  application:
    name: dad-jokes
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: "deepseek-v4-flash"
    openai:
      api-key: ${OPENROUTER_API_KEY}
      chat:
        model: "openai/gpt-4o-mini"
      base-url: "https://openrouter.ai/api/v1"
  config:
    import: vault://
  cloud:
    vault:
      uri: ${spring.cloud.vault.uri}
      token: ${spring.cloud.vault.token}
      scheme: https
      kv:
        enabled: true
        backend: secret
        # Shared bucket read by every module (store common secrets at secret/shared-secrets).
        default-context: shared-secrets
        # Per-module overrides, if any, live at secret/<application-name> and win over the shared ones.
        application-name: ${spring.application.name}
